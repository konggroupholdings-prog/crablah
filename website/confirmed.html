<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order confirmed | CrabLah</title>
  <link rel="icon" href="img/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body data-page="confirmed">
  <div id="site-header"></div>
  <main class="page">
    <div class="wrap checkout-wrap">
      <p class="kicker">Done</p>
      <h1>Order confirmed</h1>
      <p class="lede" id="confirmed-lede">We have your order. Keep this receipt. Delivery 6–8pm — the driver will message you.</p>

      <div class="panel receipt" id="receipt"></div>

      <div class="receipt-actions">
        <button class="btn btn-ink btn-lg" type="button" id="save-receipt">Save PDF</button>
        <button class="btn btn-ghost btn-lg" type="button" id="download-receipt">Download</button>
      </div>
      <p style="margin-top:28px"><a class="back" href="index.html">← Back to the table</a></p>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/ui.js"></script>
