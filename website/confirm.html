<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm order | CrabLah</title>
  <link rel="icon" href="img/logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="confirm">
  <div id="site-header"></div>
  <main class="page">
    <div class="wrap checkout-wrap">
      <a class="back" href="pay.html">← Back to payment</a>
      <div class="steps"><span>1. Delivery</span><span>2. Pay</span><span class="on">3. Confirm</span></div>
      <p class="kicker">Check this</p>
      <h1>Confirm your order</h1>
      <p class="lede">Make sure the address and mobile are right. Click on confirm below to send us your order through WhatsApp.</p>

      <div class="panel" id="review-details"></div>
      <div class="panel" id="review-order"></div>

      <p class="note" style="margin: 18px 0 12px">If something is wrong, go back and change it before you confirm.</p>
      <a class="btn btn-chilli btn-lg btn-block" id="confirm-order" href="confirmed.html">Confirm order</a>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/crm.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
