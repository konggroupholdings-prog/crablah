<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build your order | CrabLah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="img/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="build">
  <div id="site-header"></div>
  <main class="page has-sticky" id="build-root">
    <div class="wrap">
      <a class="back" id="back-link" href="single.html">← Back</a>
      <div class="steps"><span>1. Size</span><span class="on">2. Gravy</span><span>3. Pay</span></div>
      <p class="kicker">Gravy</p>
      <h1 id="build-title">Your order</h1>
      <p class="lede" id="build-sub"></p>

      <div class="panel">
        <h2>The gravy</h2>
        <p>The crab travelled from Lanka. Seafood Bag: salted egg, chilli (mild or more spicy), or black pepper. Solo and Twin Lanka also have Thai milk.</p>
        <p id="flavour-copy"></p>
        <div class="chip-row" id="flavour-chips"></div>
      </div>

      <div id="build-extras"></div>
    </div>
  </main>
  <div class="sticky">
    <div class="sticky-inner">
      <div class="sum">
        <b id="sticky-price">$0</b>
        <span id="sticky-note"></span>
      </div>
      <button class="btn btn-chilli btn-lg" type="button" id="go-checkout" style="width:auto">Checkout</button>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/products.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
